// Configuración del módulo de la aplicación.
// Es la receta de compilación: versión de Android, dependencias, etc.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ubicafe.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.ubicafe.app"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        // Usamos Java 17 para poder emplear características modernas del lenguaje.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // Sin Compose: usamos vistas clásicas (View + XML) para que el código sea simple.
        viewBinding true
    }
}

dependencies {
    // AndroidX: colecciones de componentes oficiales y estables.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Fragmentos: para la navegación interna (Inicio, Ecosistema, Búsqueda).
    implementation 'androidx.fragment:fragment:1.8.8'

    // RecyclerView: listas eficientes para cafeterías, marcas, etc.
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // CardView: tarjetas tipo "café" con esquinas redondeadas.
    implementation 'androidx.cardview:cardview:1.0.0'

    // ViewPager2: carrusel deslizable del onboarding (P2).
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // osmdroid: mapa real de OpenStreetMap (P4).
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}